<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="100%" fill="none">
  <defs>
    <style>
      .ss-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-size: 15px; font-weight: 500; fill: #4b5563; }
      .ss-dot { fill: #315f9f; }
      .ss-line { stroke: #e5e7eb; stroke-width: 1; }
      .ss-accent { stroke: #d4af37; stroke-width: 1.5; }
    </style>
  </defs>

  <line x1="0" y1="30" x2="60" y2="30" class="ss-line"/>
  <line x1="740" y1="30" x2="800" y2="30" class="ss-line"/>

  <g transform="translate(80, 35)" class="ss-text">
    <text x="0" y="0">AI Workflow Builder</text>
    <circle cx="142" cy="-5" r="2.5" class="ss-dot"/>

    <text x="160" y="0">Spec-driven Student Builder</text>
    <circle cx="350" cy="-5" r="2.5" class="ss-dot"/>

    <text x="368" y="0">Web3 Hackathon Frontend</text>
    <circle cx="542" cy="-5" r="2.5" class="ss-dot"/>

    <text x="560" y="0">Knowledge Asset Curator</text>
  </g>

  <g transform="translate(150, 58)" class="ss-text">
    <text x="0" y="0">Claude Code Operator</text>
    <circle cx="145" cy="-5" r="2.5" class="ss-dot"/>

    <text x="165" y="0">Motion UI Explorer</text>
  </g>

  <line x1="390" y1="8" x2="410" y2="8" class="ss-accent"/>
</svg>
