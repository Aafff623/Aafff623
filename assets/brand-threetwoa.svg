<svg width="920" height="190" viewBox="0 0 920 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">threetwoa</title>
  <desc id="desc">A terminal-inspired wordmark for threetwoa with the slogan Code less, Architect more.</desc>

  <defs>
    <linearGradient id="textGradient" x1="250" y1="70" x2="670" y2="125" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="58%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <linearGradient id="frameGradient" x1="80" y1="20" x2="840" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="55%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#93C5FD" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background card -->
  <rect x="86" y="32" width="748" height="118" rx="18" fill="#FFFFFF" filter="url(#softShadow)"/>

  <!-- Tech frame -->
  <path d="M116 32H804L834 62V120L804 150H116L86 120V62L116 32Z"
        stroke="url(#frameGradient)" stroke-width="2.2" fill="none"/>

  <!-- Corner accents -->
  <path d="M86 78V62L116 32H154" stroke="#2563EB" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M834 104V120L804 150H766" stroke="#2563EB" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M124 44H174" stroke="#93C5FD" stroke-width="1.5"/>
  <path d="M746 138H796" stroke="#93C5FD" stroke-width="1.5"/>

  <!-- Version + code hint -->
  <text x="112" y="26" font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#60A5FA">v1.0.0</text>
  <text x="754" y="26" font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="800" fill="#10B981">&lt;/&gt;</text>

  <!-- Terminal icon -->
  <rect x="122" y="58" width="76" height="62" rx="4" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/>
  <path d="M146 75L160 89L146 103" stroke="#0F172A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="166" y="99" width="18" height="5" rx="2.5" fill="#10B981"/>

  <!-- Wordmark -->
  <text x="230" y="105"
        font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace"
        font-size="68"
        font-weight="900"
        letter-spacing="-4"
        fill="url(#textGradient)">threetwoa</text>

  <!-- Subtitle -->
  <text x="460" y="134"
        text-anchor="middle"
        font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace"
        font-size="17"
        font-weight="800"
        letter-spacing="1.8"
        fill="#60A5FA">CODE LESS, ARCHITECT MORE</text>

  <!-- Decorative details -->
  <circle cx="812" cy="62" r="3" fill="#2563EB"/>
  <circle cx="802" cy="62" r="3" fill="#93C5FD"/>
  <circle cx="792" cy="62" r="3" fill="#BFDBFE"/>

  <path d="M648 44H704" stroke="#93C5FD" stroke-width="1.4" stroke-dasharray="5 5"/>
  <path d="M680 57H752" stroke="#60A5FA" stroke-width="1.4" stroke-dasharray="4 6"/>
  <path d="M690 119H754" stroke="#93C5FD" stroke-width="1.4" stroke-dasharray="4 6"/>

  <path d="M104 92H116" stroke="#60A5FA" stroke-width="2"/>
  <path d="M104 104H116" stroke="#60A5FA" stroke-width="2"/>
  <path d="M104 116H116" stroke="#60A5FA" stroke-width="2"/>

  <text x="790" y="132"
        font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace"
        font-size="18"
        font-weight="800"
        fill="#2563EB">32A</text>
</svg>
