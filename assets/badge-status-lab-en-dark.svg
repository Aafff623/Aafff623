<svg xmlns="http://www.w3.org/2000/svg" width="72" height="34" viewBox="0 0 72 34" fill="none">
  <defs>
    <linearGradient id="g_dark_lab_en" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="f_dark_lab_en" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#059669" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Obsidian Dark Pill Container -->
  <rect x="1" y="1" width="70" height="32" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" />
  <!-- Glowing Left Orb -->
  <circle cx="16" cy="17" r="12" fill="#051d14" stroke="url(#g_dark_lab_en)" stroke-width="1.8" filter="url(#f_dark_lab_en)" />
  <!-- Mini Internal Dash Ring -->
  <circle cx="16" cy="17" r="9.5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.75" stroke-dasharray="2 2.5" />
  <!-- Icon in Left Orb -->
  <text x="16" y="17.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">🧪</text>
  <!-- Pure Crisp White Text on Right -->
  <text x="48.0" y="17.8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="12.8" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.8">LAB</text>
</svg>