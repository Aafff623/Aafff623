<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" width="100%">
  <defs>
    <style>
      .pc-bg { fill: #FFFFFF; }
      .pc-border { fill: none; stroke: #E5E7EB; stroke-width: 1.5; }
      .pc-quote { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 22px; font-weight: 700; fill: #1F2937; }
      .pc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; fill: #4B5563; }
      .pc-accent { fill: #3B82F6; }
    </style>
  </defs>

  <rect x="0" y="0" width="720" height="150" rx="14" class="pc-bg"/>
  <rect x="0" y="0" width="720" height="150" rx="14" class="pc-border"/>

  <rect x="24" y="24" width="4" height="102" rx="2" class="pc-accent"/>

  <text x="46" y="58" class="pc-quote">I don't just ask AI to write code.</text>
  <text x="46" y="92" class="pc-text">I design prompts, tools, MCP servers, skills, reviews and docs</text>
  <text x="46" y="120" class="pc-text">into reusable workflows.</text>
</svg>
