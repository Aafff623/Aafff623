<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%">
  <defs>
    <style>
      .wf-bg { fill: #FAFAFA; }
      .wf-border { fill: none; stroke: #E5E7EB; stroke-width: 1.5; }
      .wf-box { fill: #FFFFFF; }
      .wf-box-stroke { fill: none; stroke: #D1D5DB; stroke-width: 1.2; }
      .wf-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #1F2937; }
      .wf-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; fill: #6B7280; }
      .wf-arrow { fill: none; stroke: #9CA3AF; stroke-width: 1.5; }
      .wf-head { fill: #9CA3AF; }
      .wf-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 600; fill: #3B82F6; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="150" rx="14" class="wf-bg"/>
  <rect x="0" y="0" width="800" height="150" rx="14" class="wf-border"/>

  <text x="30" y="34" class="wf-label">Workflow Map</text>

  <g transform="translate(30, 54)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="118" height="58" rx="10" class="wf-box"/>
      <rect x="0" y="0" width="118" height="58" rx="10" class="wf-box-stroke"/>
      <text x="59" y="24" text-anchor="middle" class="wf-title">GPT</text>
      <text x="59" y="42" text-anchor="middle" class="wf-sub">Brain</text>
    </g>

    <g transform="translate(118, 0)">
      <line x1="12" y1="29" x2="36" y2="29" class="wf-arrow"/>
      <polygon points="34,25 40,29 34,33" class="wf-head"/>
    </g>

    <g transform="translate(154, 0)">
      <rect x="0" y="0" width="118" height="58" rx="10" class="wf-box"/>
      <rect x="0" y="0" width="118" height="58" rx="10" class="wf-box-stroke"/>
      <text x="59" y="24" text-anchor="middle" class="wf-title">Claude Code</text>
      <text x="59" y="42" text-anchor="middle" class="wf-sub">Execute</text>
    </g>

    <g transform="translate(272, 0)">
      <line x1="12" y1="29" x2="36" y2="29" class="wf-arrow"/>
      <polygon points="34,25 40,29 34,33" class="wf-head"/>
    </g>

    <g transform="translate(308, 0)">
      <rect x="0" y="0" width="118" height="58" rx="10" class="wf-box"/>
      <rect x="0" y="0" width="118" height="58" rx="10" class="wf-box-stroke"/>
      <text x="59" y="24" text-anchor="middle" class="wf-title">Codex</text>
      <text x="59" y="42" text-anchor="middle" class="wf-sub">Review</text>
    </g>

    <g transform="translate(426, 0)">
      <line x1="12" y1="29" x2="36" y2="29" class="wf-arrow"/>
      <polygon points="34,25 40,29 34,33" class="wf-head"/>
    </g>

    <g transform="translate(462, 0)">
      <rect x="0" y="0" width="118" height="58" rx="10" class="wf-box"/>
      <rect x="0" y="0" width="118" height="58" rx="10" class="wf-box-stroke"/>
      <text x="59" y="24" text-anchor="middle" class="wf-title">Human</text>
      <text x="59" y="42" text-anchor="middle" class="wf-sub">in-the-loop</text>
    </g>

    <g transform="translate(580, 0)">
      <line x1="12" y1="29" x2="36" y2="29" class="wf-arrow"/>
      <polygon points="34,25 40,29 34,33" class="wf-head"/>
    </g>

    <g transform="translate(616, 0)">
      <rect x="0" y="0" width="134" height="58" rx="10" class="wf-box"/>
      <rect x="0" y="0" width="134" height="58" rx="10" class="wf-box-stroke"/>
      <text x="67" y="24" text-anchor="middle" class="wf-title">Reusable</text>
      <text x="67" y="42" text-anchor="middle" class="wf-sub">Assets</text>
    </g>
  </g>
</svg>
