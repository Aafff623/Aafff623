      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>
    <filter id="f_light_prototyping_en" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#8B5CF6" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Crisp Ceramic White Pill Container -->
