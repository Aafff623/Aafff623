  <text x="56.0" y="17.8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="9.8" font-weight="800" fill="#581C87" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.5">PROTOTYPE</text>
</svg>