<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%">
  <defs>
    <style>
      .ac-bg { fill: #FFFFFF; }
      .ac-border { fill: none; stroke: #E5E7EB; stroke-width: 1.5; }
      .ac-accent { fill: #3B82F6; }
      .ac-gold { fill: #D4AF37; }
      .ac-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 26px; font-weight: 700; fill: #111827; }
      .ac-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; fill: #6B7280; }
      .ac-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #1F2937; }
      .ac-tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 600; fill: #3B82F6; }
      .ac-tag-bg { fill: #EFF6FF; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="150" rx="14" class="ac-bg"/>
  <rect x="0" y="0" width="800" height="150" rx="14" class="ac-border"/>

  <rect x="24" y="24" width="40" height="40" rx="10" class="ac-accent"/>
  <text x="36" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">A</text>

  <text x="80" y="48" class="ac-title">AgentCFO</text>
  <text x="80" y="74" class="ac-sub">DAO AI 财务官 · Web3 hackathon team project</text>

  <rect x="80" y="90" width="156" height="26" rx="6" class="ac-tag-bg"/>
  <text x="92" y="107" class="ac-tag">Frontend lead / contributor</text>

  <circle cx="760" cy="30" r="5" class="ac-gold"/>
</svg>
